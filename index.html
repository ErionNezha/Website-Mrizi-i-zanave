<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Mrizi i zanave — Erion Nezha</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0e14;color:#e6e6e6;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header.top{background:linear-gradient(135deg,#0d1b2a,#1b263b);padding:28px 20px;text-align:center;border-bottom:2px solid #00d4ff33}
header.top h1{font-size:1.7rem;color:#fff;margin-bottom:8px}
header.top p{color:#9fb3c8;max-width:760px;margin:0 auto 12px;line-height:1.55;font-size:.95rem}
.badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.badge{background:#00d4ff22;border:1px solid #00d4ff66;color:#7fdbff;padding:4px 12px;border-radius:20px;font-size:.78rem}
.tabs{display:flex;gap:10px;justify-content:center;padding:16px;background:#0d1420;border-bottom:1px solid #ffffff14}
.tabs button{background:#1b263b;color:#cfd8e3;border:1px solid #ffffff22;padding:10px 22px;border-radius:8px;cursor:pointer;font-size:.92rem;transition:.2s}
.tabs button.active,.tabs button:hover{background:#00d4ff;color:#04121a;border-color:#00d4ff;font-weight:600}
main{flex:1;padding:20px;max-width:1200px;width:100%;margin:0 auto}
.panel{display:none}
.panel.active{display:block}
iframe.demo{width:100%;height:78vh;border:1px solid #ffffff22;border-radius:10px;background:#fff}
.codewrap{display:flex;gap:0;border:1px solid #ffffff22;border-radius:10px;overflow:hidden;height:78vh;background:#0d1117}
.tree{width:250px;min-width:200px;background:#0d1420;border-right:1px solid #ffffff14;overflow-y:auto;padding:12px;font-size:.82rem}
.tree .tfile{padding:5px 8px;border-radius:5px;cursor:pointer;color:#9fb3c8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree .tfile:hover{background:#ffffff10;color:#fff}
.tree .tfile.active{background:#00d4ff26;color:#7fdbff}
.tree .tdir{color:#5c6b7f;font-weight:600;margin-top:8px;font-size:.75rem;text-transform:uppercase;letter-spacing:.5px}
.codeview{flex:1;overflow:auto;padding:0;position:relative}
.codeview pre{padding:16px;font-family:'Consolas','Fira Code',monospace;font-size:.82rem;line-height:1.6;color:#d6deeb;white-space:pre}
.codeview .lineno{color:#4a5568;user-select:none;margin-right:12px;display:inline-block;width:32px;text-align:right}
.codeview img.preview{max-width:100%;padding:20px}
.cbar{display:flex;gap:8px;align-items:center;padding:10px 14px;background:#0d1420;border-bottom:1px solid #ffffff14;font-size:.82rem;color:#9fb3c8;overflow-x:auto}
.ctab{padding:6px 14px;border-radius:6px;cursor:pointer;white-space:nowrap;border:1px solid transparent}
.ctab:hover{background:#ffffff10}
.ctab.active{background:#00d4ff26;color:#7fdbff;border-color:#00d4ff55}
footer{text-align:center;padding:18px;color:#5c6b7f;font-size:.85rem;border-top:1px solid #ffffff10;margin-top:10px}
footer strong{color:#9fb3c8}
.term{background:#05070a;border:1px solid #00ff8833;border-radius:10px;overflow:hidden;height:78vh;display:flex;flex-direction:column}
.term-head{background:#0d1420;padding:10px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #ffffff14}
.dot{width:12px;height:12px;border-radius:50%}
.term-title{color:#9fb3c8;font-size:.82rem;margin-left:6px;flex:1}
.replay{background:#00ff8822;border:1px solid #00ff8866;color:#7dffb0;padding:5px 14px;border-radius:6px;cursor:pointer;font-size:.8rem}
.replay:hover{background:#00ff8844}
#term-body{flex:1;overflow-y:auto;padding:16px;font-family:'Consolas',monospace;font-size:.88rem;line-height:1.7;color:#33ff88;white-space:pre-wrap;word-break:break-word}
#term-body .inp{color:#ffd75c}
#term-body .dim{color:#4a6b57}
.cursor{display:inline-block;width:9px;height:17px;background:#33ff88;vertical-align:-3px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.split .term,.split .codewrap{height:78vh}
@media(max-width:860px){.split{grid-template-columns:1fr}.codewrap{flex-direction:column}.tree{width:100%;max-height:150px;border-right:none;border-bottom:1px solid #ffffff14}}
.kw{color:#ff7edb}.st{color:#ffd75c}.cm{color:#5c6b7f;font-style:italic}.fn{color:#7fdbff}.nm{color:#f78c6c}
.note{background:#00d4ff12;border:1px solid #00d4ff44;border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:.86rem;color:#9fb3c8;line-height:1.6}
</style>
</head>
<body>
<header class="top">
<h1>🚀 Website Mrizi i zanave</h1>
<p>🍽️ Website Mrizi i Zanave</p>
<div class="badges"><span class="badge">HTML</span><span class="badge">CSS</span><span class="badge">JavaScript</span></div>
</header>
<div class="tabs">
<button class="active" onclick="show('demo',this)">🖥️ Live Demo</button>
<button onclick="show('code',this)">📝 Kodi Burim</button>
</div>
<main>
<div class="note">💡 Demo-ja live ekzekutohet direkt në browser. Kliko <strong>Kodi Burim</strong> për të parë kodin e plotë të projektit.</div>
<div id="p-demo" class="panel active"><iframe class="demo" src="demo/index.html" title="Live demo"></iframe></div>
<div id="p-code" class="panel"><div class="codewrap">
<aside class="tree" id="tree"></aside>
<div class="codeview"><div class="cbar" id="cbar"></div><div id="codebox"><pre></pre></div></div>
</div></div>
</main>
<footer>Krijuar nga <strong>Erion Nezha</strong> — © 2026</footer>
<script>
const TREE={"dirs": [{"name": "css", "dirs": [], "files": ["components.css", "globalStyles.css", "home.css", "menu.css", "reset.css", "rrethnesh.css"]}, {"name": "images", "dirs": [], "files": ["3star.png", "address-icon.svg", "centerImg1.png", "discount-illustration.png", "event-corporate.png", "event-weedings.png", "eventsMedia1.png", "eventsMedia2.png", "facebook.svg", "favicon.ico", "food-10.png", "food-11.png", "food-12.png", "food-13.png", "food-14.png", "food-15.png", "food-16.png", "food-17.png", "food-18.png", "food-19.png", "food-20.png", "food-21.png", "food-22.png", "food-23.png", "food-24.png", "food-25.png", "food-33.png", "food-44.png", "food-55.png", "food-66.png", "food-77.png", "food-88.png", "food-99.png", "jufka.jpg", "logo.svg", "ourGoals_img1.png", "ourGoals_img2.png", "ourGoals_img3.png", "ourStoryImg.png", "phone-icon.svg", "playIcon.svg", "review_img1.png", "review_img2.png", "review_img3.png", "review_img4.png", "wall-clock-icon.svg", "whyUs-icon1.svg", "whyUs-icon2.svg", "whyUs-icon3.svg", "whyUs-icon4.svg"]}, {"name": "js", "dirs": [], "files": ["main.js"]}], "files": ["index.html", "kontakto.html", "menu.html", "rezervo.html", "rrethnesh.html", "screenshot.png"]};
const CODEDIR="demo";
const IMG=/\.(png|jpe?g|gif|svg|webp|ico|bmp)$/i;
function show(id,btn){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById('p-'+id).classList.add('active');document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
function buildTree(){
  const t=document.getElementById('tree');let html='';
  const walk=(node,prefix)=>{node.dirs.forEach(d=>{html+='<div class="tdir">📁 '+prefix+d.name+'</div>';walk(d,prefix+d.name+'/');});node.files.forEach(f=>{html+='<div class="tfile" data-p="'+prefix+f+'">📄 '+f+'</div>';});};
  walk(TREE,'');t.innerHTML=html;
  t.querySelectorAll('.tfile').forEach(el=>el.onclick=()=>openFile(el.dataset.p,el));
  const first=t.querySelector('.tfile');if(first)openFile(first.dataset.p,first);
}
async function openFile(path,el){
  document.querySelectorAll('.tfile').forEach(e=>e.classList.remove('active'));el.classList.add('active');
  document.getElementById('cbar').textContent=path;
  const box=document.getElementById('codebox');
  if(IMG.test(path)){box.innerHTML='<img class="preview" src="'+CODEDIR+'/'+path+'">';return;}
  try{const r=await fetch(CODEDIR+'/'+path);const txt=await r.text();
    box.innerHTML='<pre>'+hl(txt,path.split('.').pop())+'</pre>';
  }catch(e){box.innerHTML='<pre>Deshtoi leximi i file-it.</pre>';}
}

function hl(code,lang){
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const tok=/(\/\/[^\n]*|\/\*[\s\S]*?\*\/|#[^\n]*|<!--[\s\S]*?-->)|("[^"\n]*"|'[^'\n]*')|\b(import|from|as|def|return|if|elif|else|for|while|in|not|and|or|class|try|except|finally|with|lambda|pass|break|continue|print|public|private|protected|static|void|int|float|double|char|long|short|boolean|new|this|null|true|false|extends|implements|package|throws|struct|include|switch|case|default|do|sizeof|typedef|const|unsigned|using|namespace|cin|cout|endl|int main|string|System|out|println|var|let|function|=>)\b|\b(\d+(\.\d+)?)\b/g;
  let out='',last=0,m;
  while((m=tok.exec(code))!==null){
    out+=esc(code.slice(last,m.index));
    const cls=m[1]?'cm':m[2]?'st':m[3]?'kw':'nm';
    out+='<span class="'+cls+'">'+esc(m[0])+'</span>';
    last=m.index+m[0].length;
  }
  out+=esc(code.slice(last));
  return out.split('\n').map((l,i)=>'<span class="lineno">'+(i+1)+'</span>'+(l||' ')).join('\n');
}

buildTree();
</script>
<footer style="text-align:center;padding:24px 16px;color:#8b949e;font-family:system-ui,sans-serif;font-size:14px;">Krijuar nga Erion Nezha</footer>
</body>
</html>
